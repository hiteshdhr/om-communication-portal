spring:
  application:
    name: om-communication-portal

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  # ─── Default Profile: H2 (Local Development) ──────────────────────────────────
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  datasource:
    url: jdbc:h2:mem:omportaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # ─── Mail Settings (Dev Defaults) ───────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:mock}
    password: ${MAIL_PASSWORD:mock}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ─── JWT Settings ─────────────────────────────────────────────────────────────
# JWT_SECRET MUST be set via environment variable. No fallback — app will fail on startup if absent.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

# ─── Razorpay Credentials ─────────────────────────────────────────────────────
# RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET MUST be set via environment variable. No fallback.
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}

# ─── Admin ────────────────────────────────────────────────────────────────────
# ADMIN_INITIAL_PASSWORD MUST be set via environment variable. No fallback.
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD}

# --- App Custom Properties ---
# Set APP_FRONTEND_ORIGIN in Railway to exact Cloudflare Pages URL (no trailing slash).
# Used by SecurityConfig for CORS allowed origins.
app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}

# ─── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

logging:
  level:
    com.omcommunication: INFO
    com.omcommunication.portal.controller.AuthController: WARN
    com.omcommunication.portal.OmCommunicationPortalApplication: INFO
    org.springframework.security: WARN

---
# ─── PostgreSQL Profile (Production / Railway) ───────────────────────────────
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

# ─── JWT Settings (Production) ────────────────────────────────────────────────
# JWT_SECRET MUST be set in Railway environment. No fallback — fail-closed.
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ─── Razorpay Credentials (Production) ───────────────────────────────────────
# Must be set in Railway environment. No fallback — fail-closed.
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}

# ─── Admin (Production) ───────────────────────────────────────────────────────
# Must be set in Railway environment. No fallback — fail-closed.
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD}
